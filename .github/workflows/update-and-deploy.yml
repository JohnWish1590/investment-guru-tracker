name: update-and-deploy

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Force re-download of all 13F tables"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch SEC 13F filings
        run: python scripts/fetch_13f.py ${{ inputs.full && '--full' || '' }}

      - name: Fetch congressional and OGE disclosures
        # OGE is often unreachable from cloud IPs; the script falls back to its
        # cached index + cached parses, so this step must not fail the run.
        continue-on-error: true
        run: python scripts/fetch_politicians.py

      - name: Update Chinese security names
        run: python scripts/fetch_names.py

      - name: Build site data
        run: python scripts/build_data.py

      - name: Check for data changes
        id: diff
        run: |
          if git diff --quiet -- site/data.js data/raw/13f_raw.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no data change"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data changed"
          fi

      - name: Commit data update
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.js data/raw/13f_raw.json data/raw/politicians_raw.json data/cache/names.json
          git commit -m "chore(data): refresh disclosure data"
          git push

      - uses: actions/configure-pages@v5

      - name: Assemble site directory
        run: |
          mkdir -p _site
          cp -r site/. _site/
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
